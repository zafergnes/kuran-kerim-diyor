version: '3.8'

services:
  kuran_postgres:
    image: postgres:15-alpine
    container_name: kuran_postgres
    restart: always
    environment:
      POSTGRES_USER: kuran_admin
      POSTGRES_PASSWORD: secure_password_123
      POSTGRES_DB: kuran_db
    volumes:
      - kuran_postgres_data:/var/lib/postgresql/data
    networks:
      - emektra_emektra-network

  kuran-web:
    build:
      context: ./kuran-ne-diyor-web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://api.kurannediyor.com.tr/api
        - NEXT_PUBLIC_VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
    container_name: kuran-web
    restart: always
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_URL=https://api.kurannediyor.com.tr/api
    networks:
      - emektra_emektra-network

  kuran-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kuran-backend
    restart: always
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://kuran_admin:secure_password_123@kuran_postgres:5432/kuran_db?schema=public
      - JWT_SECRET=your_jwt_secret
      - GEMINI_API_KEY=your_gemini_key
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:info@kuran-kerim-diyor.com}
    volumes:
      - ./kuran-ne-diyor-web/data:/app/kuran-ne-diyor-web/data
    networks:
      - emektra_emektra-network

networks:
  emektra_emektra-network:
    external: true

volumes:
  kuran_postgres_data:
