services:
  kuran_postgres:
    image: postgres:15-alpine
    container_name: kuran_postgres
    restart: always
    environment:
      POSTGRES_USER: kuran_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: kuran_db
    volumes:
      - kuran_postgres_data:/var/lib/postgresql/data
    networks:
      - emektra_emektra-network

  kuran-web:
    build:
      context: ./kuran-ne-diyor-web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://api.kurannediyor.com.tr/api
        - NEXT_PUBLIC_VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
    container_name: kuran-web
    restart: always
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_URL=https://api.kurannediyor.com.tr/api
    networks:
      - emektra_emektra-network

  kuran-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kuran-backend
    restart: always
    environment:
      - PORT=3001
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      - SETTINGS_ENCRYPTION_KEY=${SETTINGS_ENCRYPTION_KEY:?SETTINGS_ENCRYPTION_KEY is required}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://kurannediyor.com.tr}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODERATION_MODEL=${GEMINI_MODERATION_MODEL:-gemini-3.5-flash-lite}
      - GEMINI_CHAT_MODEL=${GEMINI_CHAT_MODEL:-gemini-3.5-flash-lite}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_EMAIL=${VAPID_EMAIL:-https://kurannediyor.com.tr/support}
    volumes:
      - ./kuran-ne-diyor-web/data:/app/kuran-ne-diyor-web/data
    networks:
      - emektra_emektra-network

networks:
  emektra_emektra-network:
    external: true

volumes:
  kuran_postgres_data:
